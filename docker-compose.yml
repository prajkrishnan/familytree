services:
  app:
    build: .
    image: familytree:latest
    container_name: familytree
    restart: unless-stopped
    init: true
    env_file: .env
    ports:
      # Bound to loopback: only the host nginx should reach the app directly.
      - "127.0.0.1:8000:8000"
    volumes:
      # Named volume avoids host UID/GID surprises. To use a bind mount instead:
      #   mkdir -p ./data && sudo chown -R 10001:10001 ./data
      #   - ./data:/data
      - familytree_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  familytree_data:
